# Method registry.
#
# Fields:
#   type:                   raw | vanilla | align3 | self_refine | vanilla_specbench | align3_specbench | zero_think | more_think | best_of_n | tpo | ipr_prompt_refine | vlm_safety_guard | overrefusal_check | user_conditioned_safety_critic | critic_revise_agent | risk_adaptive_agent | multi_agent_consensus | self_reminder | goal_prioritization | adashield_static | intention_analysis | ecso | jailguard
#   temperature:            generation temperature
#   max_stage_tokens:       max tokens per align3 stage
#   include_safety_specs:   include safety specs in prompt (vanilla)
#   include_behavioral_specs: include behavioral specs (vanilla)
#   stages:                 align3 stage list (in order)
#   focus_violated_specs:   align3: only inject specs violated in vanilla run
#   max_iterations:         self_refine max refinement iterations
#   rethink_count:          more_think thought continuation count
#   n:                      best_of_n candidate count
#   iterations:             tpo optimization rounds
#   sample_size:            tpo candidates per round
#   assistant_name:         self_reminder: name used in the reminder (original: ChatGPT)
#   max_check_chars:        ecso: response characters shown to the harm self-check
#   n_variants:             jailguard: number of mutated inputs
#   text_threshold:         jailguard: KL-divergence threshold for text-only inputs
#   image_threshold:        jailguard: KL-divergence threshold when images are mutated
#   concurrency:            jailguard: max concurrent generations per sample
#   apply_without_image:    adashield_static: also wrap text-only requests (default: image only)
#   match_user_language:    intention_analysis: ask for a reply in the query's language

methods:
  raw:
    type: raw

  vanilla:
    type: vanilla
    include_safety_specs: true
    include_behavioral_specs: true

  align3:
    type: align3
    stages:
      - scenario_analysis
      - behavior_planning
      - safety_verification
      - synthesis_reflection
    focus_violated_specs: true
    max_stage_tokens: 1024
    temperature: 0.2

  self_refine:
    type: self_refine
    max_iterations: 3
    temperature: 0.3

  vanilla_specbench:
    type: vanilla_specbench
    temperature: 0.2

  align3_specbench:
    type: align3_specbench
    max_stage_tokens: 1024
    temperature: 0.2

  zero_think:
    type: zero_think
    temperature: 0.2

  more_think:
    type: more_think
    rethink_count: 3
    temperature: 0.2

  best_of_n:
    type: best_of_n
    n: 4
    temperature: 0.7

  tpo:
    type: tpo
    iterations: 2
    sample_size: 3
    temperature: 0.7

  ipr_prompt_refine:
    type: ipr_prompt_refine
    iterations: 3
    temperature: 0.2

  vlm_safety_guard:
    type: vlm_safety_guard
    temperature: 0.2

  overrefusal_check:
    type: overrefusal_check
    temperature: 0.2

  user_conditioned_safety_critic:
    type: user_conditioned_safety_critic
    temperature: 0.2

  critic_revise_agent:
    type: critic_revise_agent
    temperature: 0.2

  risk_adaptive_agent:
    type: risk_adaptive_agent
    temperature: 0.2

  multi_agent_consensus:
    type: multi_agent_consensus
    temperature: 0.2

  # --- training-free safety defenses (keep images; no scenario specs) ---
  self_reminder:
    type: self_reminder
    assistant_name: AI assistant

  goal_prioritization:
    type: goal_prioritization

  adashield_static:
    type: adashield_static
    apply_without_image: false

  intention_analysis:
    type: intention_analysis
    match_user_language: true

  ecso:
    type: ecso
    max_check_chars: 1927

  jailguard:
    type: jailguard
    n_variants: 8
    text_threshold: 0.02
    image_threshold: 0.025
    concurrency: 4
