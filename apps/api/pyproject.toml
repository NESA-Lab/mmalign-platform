[project]
name = "mmalign-api"
version = "0.1.0"
description = "MMAlign REST API — FastAPI presentation layer"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mmalign",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
]

[tool.uv.sources]
mmalign = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmalign_api"]
